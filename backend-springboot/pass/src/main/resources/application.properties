spring.application.name=pass

# ----------------------- SEGRETI -----------------------
# I valori reali stanno nel file .env (ignorato da git). Nomi delle variabili: vedi .env.example.
# Il file viene cercato sia avviando da pass/ sia avviando dalla cartella padre.
spring.config.import=optional:file:.env[.properties],optional:file:pass/.env[.properties]

# ----------------------- DATABASE ORACLE -----------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ----------------------- FLYWAY -----------------------
# Lo schema lo crea Flyway: i file V1__nome.sql vanno in src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ----------------------- JPA / HIBERNATE -----------------------
# validate: Hibernate non modifica il DB, controlla solo che entity e tabelle coincidano
spring.jpa.hibernate.ddl-auto=validate
# Evita query lazy fuori dal service (e connessioni tenute aperte durante il rendering)
spring.jpa.open-in-view=false
# Metti true per vedere le query SQL generate (utile per debug, mai in produzione)
spring.jpa.show-sql=false

# ----------------------- ENCRYPTION -----------------------
# La chiave di cifratura AES-256 per cifrare i dati sensibili nel DB (es. password).
app.encryption.key=${APP_ENCRYPTION_KEY}